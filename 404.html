<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting…</title>
  <meta name="robots" content="noindex, follow">
  <script>
    (function () {
      var target = 'https://tanishsidhu.pages.dev';
      var path = window.location.pathname;
      if (path === '/') path = '';
      var query = window.location.search;
      var hash = window.location.hash;
      window.location.replace(target + path + query + hash);
    })();
  </script>
  <meta http-equiv="refresh" content="0;url=https://tanishsidhu.pages.dev/">
</head>
<body>
  <p>This portfolio has moved to <a href="https://tanishsidhu.pages.dev/">https://tanishsidhu.pages.dev</a>. Redirecting…</p>
</body>
</html>
